<style>
/* Layout: one-column switchboard — search bar on top, department rows below, big-number sheet slides up on tap */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --line:#d9e2df; --fg:#14211e; --muted:#5d6f6a;
  --accent:#0d6b5a; --accent-ink:#ffffff; --accent-soft:#e1efeb;
  --call:#1f8a4c; --star:#c88a12; --danger:#b5382e;
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1614; --surface:#16211e; --line:#26342f; --fg:#e6efec; --muted:#93a6a0;
  --accent:#4fbfa6; --accent-ink:#06201a; --accent-soft:#1b302a;
  --call:#3fbf75; --star:#e3b04b; --danger:#ef7a6f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1614; --surface:#16211e; --line:#26342f; --fg:#e6efec; --muted:#93a6a0;
  --accent:#4fbfa6; --accent-ink:#06201a; --accent-soft:#1b302a;
  --call:#3fbf75; --star:#e3b04b; --danger:#ef7a6f; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:16px 10px;display:grid;gap:10px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0;letter-spacing:.2px;text-wrap:balance}
h1 small{display:block;font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px;padding:6px 0;white-space:nowrap}

.search{display:flex;gap:8px;align-items:stretch}
.field{flex:1;min-width:0;position:relative}
.field input{width:100%;height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);
  font:inherit;font-size:17px;padding:0 40px 0 16px}
.field input:focus{border-color:var(--accent);outline:none}
.clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:20px}
.mic{width:52px;height:52px;flex:none;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.mic svg{width:24px;height:24px}
.mic.on{background:var(--danger);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--danger) 50%,transparent)}50%{box-shadow:0 0 0 10px transparent}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
.hint{font-size:13px;color:var(--muted);min-height:20px}
.hint b{color:var(--fg)}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.sec{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.list{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.row:first-child{border-top:0}
.row:active{background:var(--accent-soft)}
.row .info{flex:1;min-width:0}
.row .name{font-weight:600;font-size:16px;line-height:1.3}
.row .meta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .num{font-family:var(--f-num);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;color:var(--accent);letter-spacing:.5px}
.row .fav{color:var(--star);font-size:14px;margin-right:2px}
mark{background:color-mix(in srgb,var(--star) 30%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.sample{font-size:12px;color:var(--muted);margin-top:18px;text-align:center}

/* sheet */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;
  padding:22px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  max-width:640px;margin:0 auto;display:grid;gap:14px;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet .cat{font-size:13px;color:var(--muted)}
.sheet h2{font-family:var(--f-display);font-size:24px;margin:0;line-height:1.25;text-wrap:balance}
.bignum{font-family:var(--f-num);font-weight:600;font-size:clamp(40px,13vw,60px);letter-spacing:2px;color:var(--fg);font-variant-numeric:tabular-nums;user-select:all;line-height:1.1}
.alt{display:flex;flex-wrap:wrap;gap:8px}
.alt a,.alt span{font-family:var(--f-num);font-size:15px;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.note{font-size:14px;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr auto auto;gap:8px}
.callbtn{height:56px;border-radius:14px;background:var(--call);color:#fff;font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.sbtn{height:56px;min-width:56px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:14px}
.sbtn.star[aria-pressed="true"]{color:var(--star);border-color:var(--star)}

/* editor */
.editor{display:grid;gap:10px}
.editor textarea{width:100%;min-height:42vh;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-family:var(--f-num);font-size:13px;padding:10px;line-height:1.55}
.editor p{margin:0;font-size:13.5px;color:var(--muted)}
.editor code{font-family:var(--f-num);background:var(--accent-soft);padding:1px 5px;border-radius:4px;color:var(--fg)}
.erow{display:flex;gap:8px;flex-wrap:wrap}
.pbtn{height:46px;padding:0 18px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30}
</style>

</div>

const KEY = 'hospdir.v2', FAV='hospdir.fav', REC='hospdir.rec';
const store = {get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},
               set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

function parse(txt){
  return txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map((l,i)=>{
    const c=l.split(/\t|\|/).map(s=>s.trim());
    return {id:i, name:c[0]||'', nums:(c[1]||'').split(/[,\/]/).map(s=>s.trim()).filter(Boolean),
            cat:c[2]||'อื่นๆ', alias:c[3]||'', note:c[4]||''};
  }).filter(d=>d.name && d.nums.length);
}
let raw = store.get(KEY,null);
let DATA = parse(raw ?? SAMPLE);
let favs = new Set(store.get(FAV,[]));
let recents = store.get(REC,[]);
let cat = 'ทั้งหมด'; const WARN='⚠ ต้องตรวจ';
const $ = s=>document.querySelector(s);
const esc = s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===== ค้นหา: ตัดคำพูดทั่วไปทิ้ง แล้วให้คะแนน ===== */
const FILLER = /(ขอ|เบอร์|โทร(ศัพท์)?|ไป(ที่|หา)?|หา|ติดต่อ|ห้อง(?=\s*$)|หน่อย|ครับ|ค่ะ|คะ|นะ|ด้วย|ที่|ของ|แผนก|หน่วย(งาน)?)/g;
const norm = s=>s.toLowerCase().replace(/[()\-\.\/]/g,' ').replace(/\s+/g,' ').trim();
function cleanQuery(q){ return norm(q.replace(FILLER,' ')); }
function score(d,q){
  if(!q) return 1;
  const name=norm(d.name), al=norm(d.alias), all=name+' '+al+' '+d.nums.join(' ')+' '+norm(d.cat);
  const nospace = all.replace(/\s/g,'');
  if(name===q) return 100;
  let s=0;
  if(name.startsWith(q)) s+=60;
  if(all.includes(q)) s+=40;
  else if(nospace.includes(q.replace(/\s/g,''))) s+=30;
  const toks=q.split(' ').filter(Boolean);
  if(toks.length>1 && toks.every(t=>all.includes(t))) s+=25;
  return s;
}
function hl(text,q){
  if(!q) return esc(text);
  const toks=q.split(' ').filter(t=>t.length>0).map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  if(!toks.length) return esc(text);
  return esc(text).replace(new RegExp('('+toks.join('|')+')','gi'),'<mark>$1</mark>');
}

function rowHTML(d,q){
  return `<button class="row" type="button" data-id="${d.id}">
    <div class="info"><div class="name">${favs.has(d.name)?'<span class="fav">★</span>':''}${hl(d.name,q)}</div>
    <div class="meta">${esc(d.cat)}${d.nums.length>1?' · '+d.nums.length+' เบอร์':''}${d.note?' · '+esc(d.note):''}</div></div>
    <div class="num">${hl(d.nums[0],q)}</div></button>`;
}
function renderChips(){
  const cats=['ทั้งหมด',...new Set(DATA.map(d=>d.cat))]; if(DATA.some(d=>d.note.includes('⚠'))) cats.push(WARN);
  $('#chips').innerHTML=cats.map(c=>`<button class="chip" type="button" aria-pressed="${c===cat}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
}
function render(){
  const q=cleanQuery($('#q').value);
  $('#clr').hidden=!$('#q').value;
  let pool = DATA.filter(d=>cat==='ทั้งหมด'||(cat===WARN?d.note.includes('⚠'):d.cat===cat));
  let html='';
  if(q){
    const hits=pool.map(d=>[d,score(d,q)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
    html = hits.length ? `<div class="sec">ผลการค้นหา ${hits.length} รายการ</div><div class="list">${hits.map(d=>rowHTML(d,q)).join('')}</div>`
                       : `<div class="list"><div class="empty">ไม่พบ "${esc($('#q').value)}"<br>ลองพิมพ์คำสั้นลง หรือเพิ่มคำค้นในหน้าแก้ไขรายชื่อ</div></div>`;
  }else{
    const fav=pool.filter(d=>favs.has(d.name));
    const rec=recents.map(n=>pool.find(d=>d.name===n)).filter(d=>d&&!favs.has(d.name)).slice(0,4);
    if(fav.length) html+=`<div class="sec">ติดดาว</div><div class="list">${fav.map(d=>rowHTML(d)).join('')}</div>`;
    if(rec.length) html+=`<div class="sec">โทรล่าสุด</div><div class="list">${rec.map(d=>rowHTML(d)).join('')}</div>`;
    const groups={}; pool.forEach(d=>(groups[d.cat]??=[]).push(d));
    for(const [c,arr] of Object.entries(groups)) html+=`<div class="sec">${esc(c)}</div><div class="list">${arr.map(d=>rowHTML(d)).join('')}</div>`;
  }
  $('#out').innerHTML=html;
  $('#sampleNote').hidden = raw!==null;
}

/* ===== แผ่นแสดงเบอร์ ===== */
function closeLayer(){ $('#layer').innerHTML=''; }
function toast(t){ const el=document.createElement('div'); el.className='toast'; el.textContent=t; document.body.append(el); setTimeout(()=>el.remove(),1800); }
function openSheet(d){
  const n=d.nums[0];
  $('#layer').innerHTML=`<div class="scrim" data-x></div><div class="sheet" role="dialog" aria-label="${esc(d.name)}">
    <div class="cat">${esc(d.cat)}</div><h2>${esc(d.name)}</h2>
    <div class="bignum" id="big">${esc(n)}</div>
    ${d.nums.length>1?`<div class="alt">${d.nums.slice(1).map(x=>`<a href="tel:${esc(x)}" data-call="${esc(x)}">${esc(x)}</a>`).join('')}</div>`:''}
    ${d.note?`<div class="note">${esc(d.note)}</div>`:''}
    <div class="actions">
      <a class="callbtn" href="tel:${esc(n)}" data-call="${esc(n)}">โทร ${esc(n)}</a>
      <button class="sbtn" type="button" id="cp">คัดลอก</button>
      <button class="sbtn star" type="button" id="st" aria-pressed="${favs.has(d.name)}" aria-label="ติดดาว">★</button>
    </div></div>`;
  $('#layer').onclick=e=>{
    if(e.target.dataset.x!==undefined) return closeLayer();
    const c=e.target.closest('[data-call]');
    if(c){ recents=[d.name,...recents.filter(x=>x!==d.name)].slice(0,8); store.set(REC,recents); setTimeout(render,300); }
  };
  $('#cp').onclick=()=>{ navigator.clipboard?.writeText(n).then(()=>toast('คัดลอก '+n+' แล้ว'),()=>{getSelection().selectAllChildren($('#big'));toast('เลือกเบอร์ไว้แล้ว กดคัดลอกได้เลย')}) ?? getSelection().selectAllChildren($('#big')); };
  $('#st').onclick=e=>{ favs.has(d.name)?favs.delete(d.name):favs.add(d.name); store.set(FAV,[...favs]); e.currentTarget.setAttribute('aria-pressed',favs.has(d.name)); render(); };
}

/* ===== แก้ไขรายชื่อ (วางจาก Excel) ===== */
function toText(){ return DATA.map(d=>[d.name,d.nums.join(','),d.cat,d.alias,d.note].join('\t')).join('\n'); }
function openEditor(){
  $('#layer').innerHTML=`<div class="scrim" data-x></div><div class="sheet editor" role="dialog" aria-label="แก้ไขรายชื่อ">
    <h2>แก้ไขรายชื่อหน่วยงาน</h2>
    <p>หนึ่งบรรทัดต่อหนึ่งหน่วยงาน คัดลอกจาก Excel 5 คอลัมน์มาวางได้เลย:<br><code>ชื่อ</code> <code>เบอร์ (หลายเบอร์คั่นด้วย ,)</code> <code>หมวด</code> <code>คำค้นอื่น</code> <code>หมายเหตุ</code></p>
    <textarea id="ta" spellcheck="false">${esc(toText())}</textarea>
    <div class="erow"><button class="pbtn" type="button" id="sv">บันทึก</button>
      <button class="sbtn" type="button" id="rs">กลับไปใช้ข้อมูลตั้งต้น</button>
      <button class="sbtn" type="button" data-x>ยกเลิก</button></div>
    <p>บันทึกไว้ในเครื่องนี้เท่านั้น ถ้าจะให้ทุกคนใน รพ. เห็นเบอร์ชุดเดียวกัน ให้แก้ข้อมูลในไฟล์แล้วอัปขึ้นเว็บ</p></div>`;
  $('#layer').onclick=e=>{ if(e.target.dataset.x!==undefined) closeLayer(); };
  $('#sv').onclick=()=>{ const t=$('#ta').value; const p=parse(t); if(!p.length){toast('ไม่พบรายการที่มีทั้งชื่อและเบอร์');return}
    raw=t; store.set(KEY,t); DATA=p; cat='ทั้งหมด'; renderChips(); render(); closeLayer(); toast('บันทึก '+p.length+' หน่วยงานแล้ว'); };
  $('#rs').onclick=()=>{ raw=null; try{localStorage.removeItem(KEY)}catch{} DATA=parse(SAMPLE); renderChips(); render(); closeLayer(); toast('กลับไปใช้ข้อมูลตั้งต้นแล้ว'); };
}

/* ===== สั่งงานด้วยเสียง ===== */
const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null, listening=false;
function setHint(h){ $('#hint').innerHTML=h; }
$('#mic').onclick=()=>{
  if(!SR){ setHint('เบราว์เซอร์นี้ไม่รองรับการพูด ลองเปิดด้วย <b>Chrome</b> (Android) หรือ <b>Safari</b> (iPhone)'); return; }
  if(listening){ rec.stop(); return; }
  rec=new SR(); rec.lang='th-TH'; rec.interimResults=true; rec.maxAlternatives=3;
  rec.onstart=()=>{listening=true;$('#mic').classList.add('on');setHint('กำลังฟัง… พูดชื่อหน่วยงานได้เลย');};
  rec.onresult=e=>{
    const r=e.results[e.results.length-1]; const t=r[0].transcript;
    $('#q').value=t; render();
    if(r.isFinal){
      const q=cleanQuery(t);
      const hits=DATA.map(d=>[d,score(d,q)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
      setHint(hits.length?`ได้ยินว่า <b>"${esc(t)}"</b>`:`ได้ยินว่า <b>"${esc(t)}"</b> แต่ไม่พบหน่วยงานนี้`);
      if(hits.length && (hits.length===1 || hits[0][1]-(hits[1]?.[1]||0)>=20)) openSheet(hits[0][0]);
    }
  };
  rec.onerror=e=>setHint(e.error==='not-allowed'||e.error==='service-not-allowed'
      ?'ใช้ไมค์ไม่ได้ในหน้านี้ ต้องอนุญาตไมโครโฟน หรือเปิดหน้านี้จากลิงก์เว็บของ รพ.'
      :'ไม่ได้ยินชัด ลองแตะไมค์แล้วพูดใหม่');
  rec.onend=()=>{listening=false;$('#mic').classList.remove('on');};
  try{rec.start()}catch{setHint('เปิดไมค์ไม่ได้ ลองอีกครั้ง')}
};

/* ===== events ===== */
$('#q').addEventListener('input',render);
$('#q').addEventListener('keydown',e=>{ if(e.key==='Enter'){ const f=$('#out .row'); if(f) openSheet(DATA[+f.dataset.id]); }});
$('#clr').onclick=()=>{ $('#q').value=''; render(); $('#q').focus(); };
$('#chips').onclick=e=>{ const c=e.target.closest('.chip'); if(!c) return; cat=c.dataset.c; renderChips(); render(); };
$('#out').onclick=e=>{ const r=e.target.closest('.row'); if(r) openSheet(DATA[+r.dataset.id]); };
$('#editBtn').onclick=openEditor;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeLayer(); });
renderChips(); render();
</script>
