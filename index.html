<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-column switchboard — search bar on top, department rows below, big-number sheet slides up on tap */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --line:#d9e2df; --fg:#14211e; --muted:#5d6f6a;
  --accent:#0d6b5a; --accent-ink:#ffffff; --accent-soft:#e1efeb;
  --call:#1f8a4c; --star:#c88a12; --danger:#b5382e;
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1614; --surface:#16211e; --line:#26342f; --fg:#e6efec; --muted:#93a6a0;
  --accent:#4fbfa6; --accent-ink:#06201a; --accent-soft:#1b302a;
  --call:#3fbf75; --star:#e3b04b; --danger:#ef7a6f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1614; --surface:#16211e; --line:#26342f; --fg:#e6efec; --muted:#93a6a0;
  --accent:#4fbfa6; --accent-ink:#06201a; --accent-soft:#1b302a;
  --call:#3fbf75; --star:#e3b04b; --danger:#ef7a6f; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:16px 10px;display:grid;gap:10px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0;letter-spacing:.2px;text-wrap:balance}
h1 small{display:block;font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px;padding:6px 0;white-space:nowrap}

.search{display:flex;gap:8px;align-items:stretch}
.field{flex:1;min-width:0;position:relative}
.field input{width:100%;height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);
  font:inherit;font-size:17px;padding:0 40px 0 16px}
.field input:focus{border-color:var(--accent);outline:none}
.clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:20px}
.mic{width:52px;height:52px;flex:none;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.mic svg{width:24px;height:24px}
.mic.on{background:var(--danger);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--danger) 50%,transparent)}50%{box-shadow:0 0 0 10px transparent}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
.hint{font-size:13px;color:var(--muted);min-height:20px}
.hint b{color:var(--fg)}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.sec{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.list{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.row:first-child{border-top:0}
.row:active{background:var(--accent-soft)}
.row .info{flex:1;min-width:0}
.row .name{font-weight:600;font-size:16px;line-height:1.3}
.row .meta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .num{font-family:var(--f-num);font-weight:600;font-size:24px;font-variant-numeric:tabular-nums;color:var(--fg);letter-spacing:1px}
/* search results: big cards */
.bigs{display:grid;gap:10px}
.big{display:grid;gap:2px;text-align:left;width:100%;padding:14px 18px 16px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.big:active{background:var(--accent-soft)}
.big.top{border:2px solid var(--accent);background:var(--accent-soft)}
.bname{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.3}
.bmeta{font-size:13px;color:var(--muted)}
.bnums{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 20px;margin-top:6px}
.bnums span{font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:1.5px;line-height:1.1}
.n1{font-size:clamp(38px,11vw,52px);color:var(--fg)}
.n2{font-size:clamp(24px,7vw,32px);color:var(--accent)}
.big.top .n1{font-size:clamp(52px,16vw,80px)}
.big.top .bname{font-size:22px}
.row .fav{color:var(--star);font-size:14px;margin-right:2px}
mark{background:color-mix(in srgb,var(--star) 30%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.sample{font-size:12px;color:var(--muted);margin-top:18px;text-align:center}

/* sheet */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);z-index:20}
.sheet{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:21;background:var(--surface);border-radius:20px;
  width:min(640px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;padding:24px;
  box-shadow:0 20px 60px color-mix(in srgb,#000 35%,transparent);display:grid;gap:14px;animation:up .18s ease-out}
.sheet.editor{top:50%}
@keyframes up{from{transform:translate(-50%,-50%) scale(.94);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet .cat{font-size:13px;color:var(--muted)}
.sheet h2{font-family:var(--f-display);font-size:24px;margin:0;line-height:1.25;text-wrap:balance}
.bignum{font-family:var(--f-num);font-weight:600;font-size:clamp(40px,13vw,60px);letter-spacing:2px;color:var(--fg);font-variant-numeric:tabular-nums;user-select:all;line-height:1.1}
.alt{display:flex;flex-wrap:wrap;gap:8px}
.alt a,.alt span{font-family:var(--f-num);font-size:15px;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.note{font-size:14px;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr auto auto;gap:8px}
.callbtn{height:56px;border-radius:14px;background:var(--call);color:#fff;font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.sbtn{height:56px;min-width:56px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:14px}
.sbtn.star[aria-pressed="true"]{color:var(--star);border-color:var(--star)}

/* editor */
.editor{display:grid;gap:10px}
.editor textarea{width:100%;min-height:42vh;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-family:var(--f-num);font-size:13px;padding:10px;line-height:1.55}
.editor p{margin:0;font-size:13.5px;color:var(--muted)}
.editor code{font-family:var(--f-num);background:var(--accent-soft);padding:1px 5px;border-radius:4px;color:var(--fg)}
.erow{display:flex;gap:8px;flex-wrap:wrap}
.pbtn{height:46px;padding:0 18px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30}

/* ===== Colour theme v2: each building has its own hue; depth via layered shadows ===== */
:root{
  --bg:#eef3fb; --surface:#ffffff; --line:#e3e8f2; --fg:#16203a; --muted:#66708a;
  --hero-a:#0fb5a7; --hero-b:#2f6bff; --hero-c:#ff4f8b;
  --sh1:0 1px 2px rgba(22,32,58,.06),0 4px 14px rgba(22,32,58,.07);
  --sh2:0 2px 4px rgba(22,32,58,.08),0 14px 34px rgba(22,32,58,.14);
  --sat:78%; --lit:44%; --tint:95%; --tsat:90%;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1020; --surface:#151c33; --line:#232c48; --fg:#eef2ff; --muted:#98a2c0;
  --hero-a:#0e8f86; --hero-b:#2851c9; --hero-c:#c23a6c;
  --sh1:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  --sh2:0 2px 6px rgba(0,0,0,.5),0 18px 40px rgba(0,0,0,.55);
  --sat:85%; --lit:68%; --tint:20%; --tsat:40%;}}
:root[data-theme="dark"]{
  --bg:#0b1020; --surface:#151c33; --line:#232c48; --fg:#eef2ff; --muted:#98a2c0;
  --hero-a:#0e8f86; --hero-b:#2851c9; --hero-c:#c23a6c;
  --sh1:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  --sh2:0 2px 6px rgba(0,0,0,.5),0 18px 40px rgba(0,0,0,.55);
  --sat:85%; --lit:68%; --tint:20%; --tsat:40%;}
[style*="--h"]{--c:hsl(var(--h) var(--sat) var(--lit));--ct:hsl(var(--h) var(--tsat) var(--tint));--cg:hsl(var(--h) 85% 52%)}
body{background:radial-gradient(1200px 500px at 10% -10%,color-mix(in srgb,var(--hero-a) 14%,transparent),transparent 60%),
  radial-gradient(900px 500px at 100% 0%,color-mix(in srgb,var(--hero-c) 10%,transparent),transparent 60%),var(--bg);background-attachment:fixed}
body::before{background:var(--hero-b)}

header{background:linear-gradient(125deg,var(--hero-a),var(--hero-b) 55%,var(--hero-c));color:#fff;border-radius:0 0 26px 26px;
  margin-inline:-16px;padding:20px 18px 14px;box-shadow:0 10px 30px color-mix(in srgb,var(--hero-b) 35%,transparent);overflow:hidden;isolation:isolate}
header::after{content:"";position:absolute;inset:-40% -10% auto auto;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.28),transparent 70%);z-index:-1;pointer-events:none}
@media (min-width:672px){header{margin-inline:0;border-radius:0 0 26px 26px}}
h1{font-size:26px;font-weight:700;text-shadow:0 2px 10px rgba(0,0,0,.15)}
h1 small{color:rgba(255,255,255,.85);font-weight:400;letter-spacing:.2px}
.linkbtn{color:#fff;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 14px;font-weight:500;backdrop-filter:blur(6px)}
.field input{border:0;background:#fff;color:#16203a;box-shadow:0 6px 18px rgba(10,20,60,.18),inset 0 0 0 1px rgba(255,255,255,.6)}
.field input::placeholder{color:#8a93ab}
.field input:focus{box-shadow:0 6px 18px rgba(10,20,60,.18),0 0 0 3px rgba(255,255,255,.6)}
.clear{color:#8a93ab}
.mic{background:linear-gradient(145deg,#ffd23f,#ff8a3d);color:#3a1600;box-shadow:0 6px 18px rgba(255,138,61,.5),inset 0 1px 0 rgba(255,255,255,.6)}
.mic.on{background:linear-gradient(145deg,#ff6b6b,#e0245e);color:#fff}
.hint{color:rgba(255,255,255,.88)}
.hint b{color:#fff}
.chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;font-weight:500}
.chip[aria-pressed="true"]{background:#fff;border-color:#fff;color:var(--c,#2f6bff);font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.chip[style*="--h"]::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cg);margin-right:6px;vertical-align:1px;box-shadow:0 0 0 2px rgba(255,255,255,.7)}

.sec{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;letter-spacing:.3px;text-transform:none;color:var(--c,var(--muted));margin:24px 4px 8px}
.sec[style*="--h"]::before{content:"";width:10px;height:22px;border-radius:4px;background:linear-gradient(var(--cg),var(--c))}
.sec .cnt{font-weight:400;color:var(--muted);font-size:12.5px}
.list{border:0;border-radius:18px;box-shadow:var(--sh1)}
.row{position:relative;padding:13px 16px 13px 20px}
.row[style*="--h"]::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:5px;border-radius:0 4px 4px 0;background:var(--c)}
.row:hover{background:color-mix(in srgb,var(--ct) 60%,transparent)}
.row:active{background:var(--ct)}
.row .name{font-weight:600}
.row .meta{font-weight:300}
.row .num{color:var(--c,var(--fg));font-weight:700;font-size:25px;text-shadow:0 1px 0 color-mix(in srgb,var(--c,#000) 15%,transparent)}

.big{border:0;background:linear-gradient(135deg,var(--surface) 55%,var(--ct));box-shadow:var(--sh1);border-left:6px solid var(--c);border-radius:18px}
.big .n1{color:var(--c)}
.big .n2{color:var(--c);opacity:.7;font-weight:500}
.big .bmeta{font-weight:300}
.big.top{border:0;color:#fff;background:linear-gradient(135deg,var(--cg),hsl(calc(var(--h) + 35) 80% 42%));box-shadow:0 16px 40px color-mix(in srgb,var(--cg) 45%,transparent)}
.big.top .n1,.big.top .n2{color:#fff}
.big.top .bmeta{color:rgba(255,255,255,.85)}
.big.top mark{background:rgba(255,255,255,.3)}

.scrim{background:rgba(8,12,30,.55);backdrop-filter:blur(3px)}
.sheet{overflow:hidden;padding:0;gap:0;box-shadow:var(--sh2),0 30px 80px rgba(0,0,0,.25)}
.sheet .shead{background:linear-gradient(135deg,var(--cg,var(--hero-b)),hsl(calc(var(--h,220) + 35) 80% 42%));color:#fff;padding:20px 24px 18px;display:grid;gap:4px}
.sheet .shead .cat{color:rgba(255,255,255,.85);font-weight:500}
.sheet .shead .bignum{color:#fff;font-size:clamp(56px,17vw,88px);font-weight:700;text-shadow:0 4px 18px rgba(0,0,0,.18);margin-top:4px}
.sheet .sbody{padding:18px 24px 22px;display:grid;gap:14px}
.alt a{color:var(--c);border-color:color-mix(in srgb,var(--c) 35%,transparent);background:var(--ct);font-weight:600;font-size:18px;padding:6px 14px}
.callbtn{background:linear-gradient(135deg,#22c55e,#0ea371);box-shadow:0 8px 20px rgba(14,163,113,.4);font-size:20px}
.sbtn{background:var(--surface);box-shadow:var(--sh1);border-color:var(--line)}
.sheet.editor{padding:24px;gap:10px}
.pbtn{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#fff}
.sample{font-weight:300}
.list,.bigs{grid-template-columns:minmax(0,1fr)}
.row .num{flex:none;white-space:nowrap}
.row .info{overflow:hidden}
.field input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.big.top mark,.big.top .bname mark{color:#fff}
.bignum.long,.sheet .shead .bignum.long{font-size:clamp(34px,10vw,52px);letter-spacing:1px}
.bnums span.long.n1,.big.top .n1.long{font-size:clamp(28px,8.5vw,44px)}
.bnums span.long.n2{font-size:clamp(18px,5vw,24px)}
.row .num{font-size:min(25px,6vw)}
</style>

<div class="wrap">
  <header>
    <div class="top">
      <h1>สมุดโทรศัพท์ภายใน<small id="hosp">โรงพยาบาลมหาสารคาม · กดชื่อแล้วโทรได้เลย</small></h1>
      <button class="linkbtn" id="editBtn" type="button">แก้ไขรายชื่อ</button>
    </div>
    <div class="search">
      <div class="field">
        <input id="q" type="search" placeholder="พิมพ์ชื่อ เช่น ER, ICU med, ห้องคลอด, อช" autocomplete="off" aria-label="ค้นหาหน่วยงาน">
        <button class="clear" id="clr" type="button" aria-label="ล้าง" hidden>×</button>
      </div>
      <button class="mic" id="mic" type="button" aria-label="พูดเพื่อค้นหา">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
    </div>
    <div class="hint" id="hint">แตะไมค์แล้วพูด เช่น <b>"โทรไปห้องคลอด"</b></div>
    <div class="chips" id="chips"></div>
  </header>
  <main id="out"></main>
  <p class="sample" id="sampleNote">รวมจากแผ่นติดผนังและทะเบียนโทรศัพท์ รพ. (UP 8 ต.ค. 69) รายการที่มี ⚠ ควรโทรยืนยันก่อน</p>
</div>

const KEY = 'hospdir.v3', FAV='hospdir.fav', REC='hospdir.rec';
const store = {get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},
               set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

function parse(txt){
  return txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map((l,i)=>{
    const c=l.split(/\t|\|/).map(s=>s.trim());
    return {id:i, name:c[0]||'', nums:(c[1]||'').split(/[,\/]/).map(s=>s.trim()).filter(Boolean),
            cat:c[2]||'อื่นๆ', alias:c[3]||'', note:c[4]||''};
  }).filter(d=>d.name && d.nums.length);
}
let raw = store.get(KEY,null);
let DATA = parse(raw ?? SAMPLE);
let favs = new Set(store.get(FAV,[]));
let recents = store.get(REC,[]);
let cat = 'ทั้งหมด'; const WARN='⚠ ต้องตรวจ';
const $ = s=>document.querySelector(s);
const esc = s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===== ค้นหา: ตัดคำพูดทั่วไปทิ้ง แล้วให้คะแนน ===== */
const FILLER = /(ขอ|เบอร์|โทร(ศัพท์)?|ไป(ที่|หา)?|หา|ติดต่อ|ห้อง(?=\s*$)|หน่อย|ครับ|ค่ะ|คะ|นะ|ด้วย|ที่|ของ|แผนก|หน่วย(งาน)?)/g;
const norm = s=>s.toLowerCase().replace(/[()\-\.\/]/g,' ').replace(/\s+/g,' ').trim();
function cleanQuery(q){ return norm(q.replace(FILLER,' ')); }
function score(d,q){
  if(!q) return 1;
  const name=norm(d.name), al=norm(d.alias), all=name+' '+al+' '+d.nums.join(' ')+' '+norm(d.cat);
  const nospace = all.replace(/\s/g,'');
  if(name===q) return 100;
  const exactAlias = al.split(' ').includes(q);
  let s=0;
  if(name.startsWith(q)) s+=60;
  if(all.includes(q)) s+=40;
  else if(nospace.includes(q.replace(/\s/g,''))) s+=30;
  const toks=q.split(' ').filter(Boolean);
  if(toks.length>1 && toks.every(t=>all.includes(t))) s+=25;
  if(exactAlias) s+=45;
  return s;
}
function hl(text,q){
  if(!q) return esc(text);
  const toks=q.split(' ').filter(t=>t.length>0).map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  if(!toks.length) return esc(text);
  return esc(text).replace(new RegExp('('+toks.join('|')+')','gi'),'<mark>$1</mark>');
}

const HUES=[200,350,28,262,145,190,320,12,232,300,170,280,128,215];
const hueOf=c=>{const cats=[...new Set(DATA.map(d=>d.cat))];const i=cats.indexOf(c);return i<0?220:HUES[i%HUES.length]};
function rowHTML(d,q){
  return `<button class="row" type="button" data-id="${d.id}" style="--h:${hueOf(d.cat)}">
    <div class="info"><div class="name">${favs.has(d.name)?'<span class="fav">★</span>':''}${hl(d.name,q)}</div>
    <div class="meta">${esc(d.cat)}${d.nums.length>1?' · '+d.nums.length+' เบอร์':''}${d.note?' · '+esc(d.note):''}</div></div>
    <div class="num">${hl(d.nums[0],q)}</div></button>`;
}
function bigHTML(d,q,top){
  return `<button class="big${top?' top':''}" type="button" data-id="${d.id}" style="--h:${hueOf(d.cat)}">
    <div class="bname">${favs.has(d.name)?'<span class="fav">★</span>':''}${hl(d.name,q)}</div>
    <div class="bmeta">${esc(d.cat)}${d.note?' · '+esc(d.note):''}</div>
    <div class="bnums">${d.nums.map((n,i)=>`<span class="${i?'n2':'n1'}${n.length>5?' long':''}">${hl(n,q)}</span>`).join('')}</div></button>`;
}
function renderChips(){
  const cats=['ทั้งหมด',...new Set(DATA.map(d=>d.cat))]; if(DATA.some(d=>d.note.includes('⚠'))) cats.push(WARN);
  $('#chips').innerHTML=cats.map(c=>`<button class="chip" type="button" aria-pressed="${c===cat}" data-c="${esc(c)}"${DATA.some(d=>d.cat===c)?` style="--h:${hueOf(c)}"`:''}>${esc(c)}</button>`).join('');
}
function render(){
  const q=cleanQuery($('#q').value);
  $('#clr').hidden=!$('#q').value;
  let pool = DATA.filter(d=>cat==='ทั้งหมด'||(cat===WARN?d.note.includes('⚠'):d.cat===cat));
  let html='';
  if(q){
    const scored=pool.map(d=>[d,score(d,q)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
    const hits=scored.map(x=>x[0]);
    const clear = scored.length===1 || (scored.length>1 && scored[0][1]-scored[1][1]>=20);
    html = hits.length ? `<div class="sec">ผลการค้นหา ${hits.length} รายการ</div><div class="bigs">${hits.map((d,i)=>bigHTML(d,q,i===0&&clear)).join('')}</div>`
                       : `<div class="list"><div class="empty">ไม่พบ "${esc($('#q').value)}"<br>ลองพิมพ์คำสั้นลง หรือเพิ่มคำค้นในหน้าแก้ไขรายชื่อ</div></div>`;
  }else{
    const fav=pool.filter(d=>favs.has(d.name));
    const rec=recents.map(n=>pool.find(d=>d.name===n)).filter(d=>d&&!favs.has(d.name)).slice(0,4);
    if(fav.length) html+=`<div class="sec">ติดดาว</div><div class="list">${fav.map(d=>rowHTML(d)).join('')}</div>`;
    if(rec.length) html+=`<div class="sec">โทรล่าสุด</div><div class="list">${rec.map(d=>rowHTML(d)).join('')}</div>`;
    const groups={}; pool.forEach(d=>(groups[d.cat]??=[]).push(d));
    for(const [c,arr] of Object.entries(groups)) html+=`<div class="sec" style="--h:${hueOf(c)}">${esc(c)} <span class="cnt">${arr.length} หน่วยงาน</span></div><div class="list">${arr.map(d=>rowHTML(d)).join('')}</div>`;
  }
  $('#out').innerHTML=html;
  $('#sampleNote').hidden = raw!==null;
}

/* ===== แผ่นแสดงเบอร์ ===== */
function closeLayer(){ $('#layer').innerHTML=''; }
function toast(t){ const el=document.createElement('div'); el.className='toast'; el.textContent=t; document.body.append(el); setTimeout(()=>el.remove(),1800); }
function openSheet(d){
  const n=d.nums[0];
  $('#layer').innerHTML=`<div class="scrim" data-x></div><div class="sheet" role="dialog" aria-label="${esc(d.name)}" style="--h:${hueOf(d.cat)}">
    <div class="shead"><div class="cat">${esc(d.cat)}</div><h2>${esc(d.name)}</h2>
    <div class="bignum${n.length>5?' long':''}" id="big">${esc(n)}</div></div><div class="sbody">
    ${d.nums.length>1?`<div class="alt">${d.nums.slice(1).map(x=>`<a href="tel:${esc(x)}" data-call="${esc(x)}">${esc(x)}</a>`).join('')}</div>`:''}
    ${d.note?`<div class="note">${esc(d.note)}</div>`:''}
    <div class="actions">
      <a class="callbtn" href="tel:${esc(n)}" data-call="${esc(n)}">โทร ${esc(n)}</a>
      <button class="sbtn" type="button" id="cp">คัดลอก</button>
      <button class="sbtn star" type="button" id="st" aria-pressed="${favs.has(d.name)}" aria-label="ติดดาว">★</button>
    </div></div></div>`;
  $('#layer').onclick=e=>{
    if(e.target.dataset.x!==undefined) return closeLayer();
    const c=e.target.closest('[data-call]');
    if(c){ recents=[d.name,...recents.filter(x=>x!==d.name)].slice(0,8); store.set(REC,recents); setTimeout(render,300); }
  };
  $('#cp').onclick=()=>{ navigator.clipboard?.writeText(n).then(()=>toast('คัดลอก '+n+' แล้ว'),()=>{getSelection().selectAllChildren($('#big'));toast('เลือกเบอร์ไว้แล้ว กดคัดลอกได้เลย')}) ?? getSelection().selectAllChildren($('#big')); };
  $('#st').onclick=e=>{ favs.has(d.name)?favs.delete(d.name):favs.add(d.name); store.set(FAV,[...favs]); e.currentTarget.setAttribute('aria-pressed',favs.has(d.name)); render(); };
}

/* ===== แก้ไขรายชื่อ (วางจาก Excel) ===== */
function toText(){ return DATA.map(d=>[d.name,d.nums.join(','),d.cat,d.alias,d.note].join('\t')).join('\n'); }
function openEditor(){
  $('#layer').innerHTML=`<div class="scrim" data-x></div><div class="sheet editor" role="dialog" aria-label="แก้ไขรายชื่อ">
    <h2>แก้ไขรายชื่อหน่วยงาน</h2>
    <p>หนึ่งบรรทัดต่อหนึ่งหน่วยงาน คัดลอกจาก Excel 5 คอลัมน์มาวางได้เลย:<br><code>ชื่อ</code> <code>เบอร์ (หลายเบอร์คั่นด้วย ,)</code> <code>หมวด</code> <code>คำค้นอื่น</code> <code>หมายเหตุ</code></p>
    <textarea id="ta" spellcheck="false">${esc(toText())}</textarea>
    <div class="erow"><button class="pbtn" type="button" id="sv">บันทึก</button>
      <button class="sbtn" type="button" id="rs">กลับไปใช้ข้อมูลตั้งต้น</button>
      <button class="sbtn" type="button" data-x>ยกเลิก</button></div>
    <p>บันทึกไว้ในเครื่องนี้เท่านั้น ถ้าจะให้ทุกคนใน รพ. เห็นเบอร์ชุดเดียวกัน ให้แก้ข้อมูลในไฟล์แล้วอัปขึ้นเว็บ</p></div>`;
  $('#layer').onclick=e=>{ if(e.target.dataset.x!==undefined) closeLayer(); };
  $('#sv').onclick=()=>{ const t=$('#ta').value; const p=parse(t); if(!p.length){toast('ไม่พบรายการที่มีทั้งชื่อและเบอร์');return}
    raw=t; store.set(KEY,t); DATA=p; cat='ทั้งหมด'; renderChips(); render(); closeLayer(); toast('บันทึก '+p.length+' หน่วยงานแล้ว'); };
  $('#rs').onclick=()=>{ raw=null; try{localStorage.removeItem(KEY)}catch{} DATA=parse(SAMPLE); renderChips(); render(); closeLayer(); toast('กลับไปใช้ข้อมูลตั้งต้นแล้ว'); };
}

/* ===== สั่งงานด้วยเสียง ===== */
const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null, listening=false;
function setHint(h){ $('#hint').innerHTML=h; }
$('#mic').onclick=()=>{
  if(!SR){ setHint('เบราว์เซอร์นี้ไม่รองรับการพูด ลองเปิดด้วย <b>Chrome</b> (Android) หรือ <b>Safari</b> (iPhone)'); return; }
  if(listening){ rec.stop(); return; }
  rec=new SR(); rec.lang='th-TH'; rec.interimResults=true; rec.maxAlternatives=3;
  rec.onstart=()=>{listening=true;$('#mic').classList.add('on');setHint('กำลังฟัง… พูดชื่อหน่วยงานได้เลย');};
  rec.onresult=e=>{
    const r=e.results[e.results.length-1]; const t=r[0].transcript;
    $('#q').value=t; render();
    if(r.isFinal){
      const q=cleanQuery(t);
      const hits=DATA.map(d=>[d,score(d,q)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
      setHint(hits.length?`ได้ยินว่า <b>"${esc(t)}"</b>`:`ได้ยินว่า <b>"${esc(t)}"</b> แต่ไม่พบหน่วยงานนี้`);
      if(hits.length && (hits.length===1 || hits[0][1]-(hits[1]?.[1]||0)>=20)) openSheet(hits[0][0]);
    }
  };
  rec.onerror=e=>setHint(e.error==='not-allowed'||e.error==='service-not-allowed'
      ?'ใช้ไมค์ไม่ได้ในหน้านี้ ต้องอนุญาตไมโครโฟน หรือเปิดหน้านี้จากลิงก์เว็บของ รพ.'
      :'ไม่ได้ยินชัด ลองแตะไมค์แล้วพูดใหม่');
  rec.onend=()=>{listening=false;$('#mic').classList.remove('on');};
  try{rec.start()}catch{setHint('เปิดไมค์ไม่ได้ ลองอีกครั้ง')}
};

/* ===== events ===== */
$('#q').addEventListener('input',render);
$('#q').addEventListener('keydown',e=>{ if(e.key==='Enter'){ const f=$('#out .row'); if(f) openSheet(DATA[+f.dataset.id]); }});
$('#clr').onclick=()=>{ $('#q').value=''; render(); $('#q').focus(); };
$('#chips').onclick=e=>{ const c=e.target.closest('.chip'); if(!c) return; cat=c.dataset.c; renderChips(); render(); };
$('#out').onclick=e=>{ const r=e.target.closest('.row,.big'); if(r) openSheet(DATA[+r.dataset.id]); };
$('#editBtn').onclick=openEditor;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeLayer(); });
renderChips(); render();
</script>
